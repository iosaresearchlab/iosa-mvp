# CI for the v2 implementation loop (docs/08-implementation-plan.md, T-01).
# Runs the backend tests and the frontend build on every push to the working
# branch and on every pull request. It never calls the YouTube API and holds
# no secrets.
name: CI

on:
  push:
    branches: [docs/methodology-v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    env:
      # Placeholders, not secrets. vpi_engine.py refuses to import without
      # Supabase credentials; tests mock every HTTP call, so nothing is
      # contacted. No YouTube key is set: a test that reached the real API
      # would fail rather than spend quota.
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: pytest
        run: pytest -q

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders, not secrets. The Supabase client refuses an empty URL
      # at build time; a local address that refuses connections lets the
      # build complete without sending any request outside the runner.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
