# Alternativa gratuita al Background Worker: un cron di fuori che sveglia il
# servizio e gli fa fare un giro. Piu' fragile di un worker dedicato (dipende
# da GitHub e dal risveglio di Render) ma non costa niente.
#
# Serve il segreto INGEST_TRIGGER_TOKEN nel repository, uguale alla variabile
# d'ambiente omonima sul backend.
name: Ingestione IOSA

on:
  schedule:
    # Ogni 20 minuti. GitHub non garantisce la puntualita' dei cron: sotto
    # carico possono slittare di parecchi minuti.
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  giro:
    runs-on: ubuntu-latest
    steps:
      - name: Chiede un giro di ingestione
        run: |
          set -euo pipefail
          # Render risponde lento quando il servizio si sta risvegliando.
          codice=$(curl -s -o /tmp/risposta.json -w "%{http_code}" -m 120 \
            -X POST "https://iosa-mvp-backend.onrender.com/api/ingest/run" \
            -H "Authorization: Bearer ${{ secrets.INGEST_TRIGGER_TOKEN }}")
          echo "HTTP $codice"; cat /tmp/risposta.json; echo
          test "$codice" = "200"
