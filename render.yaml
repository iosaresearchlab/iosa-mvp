# Dispiegamento su Render, piano gratuito.
#
# Un solo servizio: non c'e' budget per un worker dedicato. Lo scheduler del
# motore sta nel database (pg_cron su Supabase, gia' compreso), che chiama
# POST /api/ingest/run ogni venti minuti. La chiamata in arrivo sveglia anche
# il servizio se e' andato in sospensione, che e' proprio il problema che
# stiamo risolvendo.
services:
  - type: web
    name: iosa-mvp-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Lo scheduler interno resta spento: ci pensa pg_cron. Lasciarlo acceso
      # significherebbe ingerire due volte gli stessi video quando il servizio
      # e' sveglio, e pagare due volte la quota YouTube.
      - key: IOSA_ENGINE_MODE
        value: "off"
      # Deve essere identico al segreto omonimo nel Vault di Supabase.
      # Si copia dal pannello Supabase: Project Settings -> Vault.
      - key: INGEST_TRIGGER_TOKEN
        sync: false
