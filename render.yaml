# Dispiegamento su Render.
#
# Il punto di questo file: separare il servizio web dal motore di ingestione.
# Finche' il motore girava dentro il web service, il piano gratuito lo spegneva
# dopo un quarto d'ora senza traffico e l'indice restava fermo per ore ogni
# notte. Un lavoro ogni 20 minuti non puo' dipendere da chi visita il sito.
services:
  - type: web
    name: iosa-mvp-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Il web service NON fa piu' girare lo scheduler: lo fa il worker qui
      # sotto. Lasciarlo a 'inline' su entrambi significherebbe ingerire due
      # volte gli stessi video e pagare due volte la quota.
      - key: IOSA_ENGINE_MODE
        value: "off"

  - type: worker
    name: iosa-mvp-engine
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run_engine.py
    envVars:
      - key: IOSA_ENGINE_MODE
        value: worker
      - key: INGEST_INTERVAL_MINUTES
        value: "20"
