<!doctype html><html><head><meta charset="utf-8"><title>IOSA breakout · the why</title>
<!-- Instagram carousel slide 3 of a breakout (owner, 20/10/2026): one short line on what this
     video did differently (written in the spec, read from its title, length, format or
     timing, never invented), the video title, "Every day's breakouts: link in bio", the IOSA
     mark. Same look as card_breakout.html. Rendered by render_card.py; example:
     example_breakout_why.json. Data: where, why, title, who, x (optional), cta (optional). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;800;900&display=swap">
<style>
  :root{--ground:#0d1117;--surface:#161c26;--line:#26303d;--ink:#eef3f8;--muted:#8496a8;--accent:#00e5ff;--amber:#ffb020;--dim:#2a3442;}
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;}
  .card{display:flex;background:radial-gradient(900px 600px at 80% 12%, rgba(0,229,255,.12), transparent 60%), radial-gradient(800px 600px at 10% 95%, rgba(255,176,32,.07), transparent 60%), var(--ground);width:1080px;height:1350px;box-sizing:border-box;padding:72px 72px 56px;flex-direction:column;}
  .mono{font-family:"JetBrains Mono",monospace;}
  .eyebrow{font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;}
  .eyebrow b{color:var(--accent);font-weight:700;}
  .k{margin-top:120px;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);}
  .why{margin:22px 0 0;font-weight:900;letter-spacing:-.03em;line-height:1.06;color:var(--ink);font-size:84px;}
  .why em{font-style:normal;color:var(--accent);}
  .rule{width:120px;height:6px;background:var(--accent);border-radius:3px;margin-top:56px;box-shadow:0 0 30px rgba(0,229,255,.5);}
  .vt{margin-top:48px;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .title{margin:0;font-size:38px;line-height:1.2;font-weight:800;letter-spacing:-.01em;color:var(--ink);
         display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .who{margin-top:18px;font-size:30px;line-height:1.3;font-weight:500;color:var(--muted);}
  .who strong{color:var(--ink);font-weight:800;}
  .who .x{color:var(--accent);font-weight:800;}
  .grow{flex:1;}
  .cta{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 36px;}
  .cta span{font-weight:900;font-size:46px;letter-spacing:-.02em;}
  .cta b{color:var(--accent);}
  .cta svg{flex-shrink:0;}
  footer{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:24px;margin-top:36px;}
  .mark{display:block;font-weight:700;font-size:20px;}
  .sub{display:block;font-size:14px;letter-spacing:.14em;color:var(--muted);margin-top:4px;}
  footer > div:last-child{color:var(--muted);font-size:20px;}
</style></head><body>
<section class="card" id="card">
  <div class="eyebrow mono"><span><b>IOSA</b> · Why this one broke out</span><span id="where"></span></div>
  <div class="k mono">What it did differently</div>
  <p class="why" id="why"></p>
  <div class="rule"></div>
  <div class="vt mono">The video</div>
  <p class="title" id="title"></p>
  <p class="who" id="who"></p>
  <div class="grow"></div>
  <div class="cta"><span id="cta"></span>
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </div>
  <footer class="mono"><div><span class="mark">IOSA</span><span class="sub">INSTITUTE FOR OPEN SOCIAL ANALYTICS</span></div><div>iosaresearch.org</div></footer>
</section>
<script>
(() => {
  const D = JSON.parse(new URLSearchParams(location.search).get('d'));
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  $('where').innerHTML = esc(D.where);
  // *word* in the line marks the words to light in the accent colour
  $('why').innerHTML = esc(D.why).replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const L = (D.why || '').replace(/\*/g, '').length;
  $('why').style.fontSize = (L > 110 ? 60 : L > 80 ? 70 : 84) + 'px';
  $('title').textContent = '“' + (D.title || '') + '”';
  $('who').innerHTML = (D.who || '') + (D.x ? ' · <span class="x">' + esc(D.x) + ' its usual</span>' : '');
  $('cta').innerHTML = esc(D.cta || "Every day's breakouts: link in bio").replace(':', ':<br><b>') + '</b>';
})();
</script>
</body></html>
