<!doctype html><html><head><meta charset="utf-8"><title>IOSA channels to watch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;800;900&display=swap">
<style>
  :root{--ground:#0d1117;--surface:#161c26;--line:#26303d;--ink:#eef3f8;--muted:#8496a8;--accent:#00e5ff;--amber:#ffb020;}
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;}
  .card{display:flex;flex-direction:column;background:radial-gradient(900px 600px at 15% 8%, rgba(255,176,32,.10), transparent 60%), radial-gradient(800px 600px at 90% 98%, rgba(0,229,255,.09), transparent 60%), var(--ground);width:1080px;height:1350px;box-sizing:border-box;padding:60px 72px 50px;}
  .mono{font-family:"JetBrains Mono",monospace;}
  .eyebrow{font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;}
  .eyebrow b{color:var(--amber);font-weight:700;}
  h1{margin:28px 0 0;font-size:60px;line-height:1.04;font-weight:900;letter-spacing:-.03em;}
  h1 em{font-style:normal;color:var(--amber);}
  .lede{margin-top:12px;font-size:19px;color:var(--muted);line-height:1.4;}
  .list{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
  .ch{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px 10px 20px;display:grid;grid-template-columns:340px 1fr;column-gap:14px;align-items:center;height:142px;box-sizing:border-box;}
  .nm{font-size:27px;font-weight:900;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nm .rk{color:var(--amber);font-family:"JetBrains Mono",monospace;font-weight:700;font-size:22px;margin-right:6px;}
  .meta{font-size:15px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rep{display:flex;align-items:baseline;gap:8px;margin-top:8px;}
  .rep .n{font-size:40px;font-weight:900;color:var(--accent);letter-spacing:-.02em;line-height:1;}
  .rep .l{font-size:16px;color:var(--muted);line-height:1.25;}
  .rep .l b{color:var(--ink);font-weight:600;}
  svg{display:block;overflow:visible;}
  .axis{display:grid;grid-template-columns:340px 1fr;column-gap:14px;padding:6px 16px 0 20px;}
  .grow{flex:1;}
  .src{font-size:15px;color:var(--muted);line-height:1.5;margin:0;}
  footer{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:20px;margin-top:20px;}
  .mark{display:block;font-weight:700;font-size:20px;}
  .sub{display:block;font-size:14px;letter-spacing:.14em;color:var(--muted);margin-top:4px;}
  footer > div:last-child{color:var(--muted);font-size:20px;}
</style></head><body>
<section class="card" id="card">
  <div class="eyebrow mono"><span><b>IOSA</b> · 5 channels to watch</span><span id="where"></span></div>
  <h1>They keep beating <em>their own numbers</em></h1>
  <div class="lede mono" id="lede"></div>
  <div class="list" id="rows"></div>
  <div class="axis mono"><span id="axicon" style="display:flex;justify-content:flex-end;align-items:center;padding-right:0"></span><svg id="ax" height="24"></svg></div>
  <div class="grow"></div>
  <p class="src mono" id="src"></p>
  <footer class="mono"><div><span class="mark">IOSA</span><span class="sub">INSTITUTE FOR OPEN SOCIAL ANALYTICS</span></div><div>iosaresearch.org</div></footer>
</section>
<script>
/* Data: {where, lede, src, from:"YYYY-MM-DD", to:"YYYY-MM-DD",
   rows:[{name, flag, meta, usual, points:[{d:"YYYY-MM-DD", v:4.8}, ...]}]}
   Each point = one video: x = the day it was first observed in Most Popular,
   height = its day-1 multiple of the channel's usual, on a log scale shared by the five rows. */
const ICONS={"calendar": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2.5\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/>", "stopwatch": "<circle cx=\"12\" cy=\"14\" r=\"7.5\"/><path d=\"M12 14V10M9.5 2.5h5M12 2.5v4M18.2 7.3l1.6-1.6\"/>"};
const icon=(n,s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block">${ICONS[n]}</svg>`;
const D=JSON.parse(new URLSearchParams(location.search).get('d'));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const NS='http://www.w3.org/2000/svg';
const day=s=>Date.parse(s+'T00:00:00Z')/864e5;
const fmt=v=>v.toFixed(1)+'×';
document.getElementById('where').textContent=D.where;
document.getElementById('lede').innerHTML=D.lede;
document.getElementById('src').innerHTML=D.src;
const x0=day(D.from), x1=day(D.to);
const vmax=Math.max(...D.rows.flatMap(r=>r.points.map(p=>p.v)));
const ticks=[1,2,5,10,20,30,50,100,200,500,1000];
const yTop=ticks.find(t=>t>=vmax*1.15)||vmax*1.2;
const W=540, H=120, PL=46, PR=22, PT=24, PB=6;
const X=d=>PL+(day(d)-x0)/(x1-x0||1)*(W-PL-PR);
const Y=v=>PT+(1-Math.log(v)/Math.log(yTop))*(H-PT-PB);
function el(tag,attrs,parent,txt){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;parent.appendChild(e);return e;}
function chart(r){
  const s=document.createElementNS(NS,'svg');s.setAttribute('width',W);s.setAttribute('height',H);
  // reference lines: 1x = the channel's usual, 2x = the list's threshold, plus 10x when in range
  [[1,'1×','#5b6b7d',''],[2,'2×','#5b6b7d','5 5'],[10,'10×','#2c3846','2 6']].forEach(([v,l,c,da])=>{
    if(v>yTop)return;
    el('line',{x1:PL,x2:W-PR,y1:Y(v),y2:Y(v),stroke:c,'stroke-width':v===1?2:1.2,'stroke-dasharray':da},s);
    el('text',{x:PL-8,y:Y(v)+5,'text-anchor':'end','font-size':14,fill:'#8496a8','font-family':'JetBrains Mono'},s,l);
  });
  const pts=[...r.points].sort((a,b)=>day(a.d)-day(b.d));
  // trend: thin line through the tops
  el('polyline',{points:pts.map(p=>X(p.d)+','+Y(p.v)).join(' '),fill:'none',stroke:'rgba(0,229,255,.38)','stroke-width':2,'stroke-linejoin':'round'},s);
  // spikes
  pts.forEach(p=>{
    el('line',{x1:X(p.d),x2:X(p.d),y1:Y(1),y2:Y(p.v),stroke:'#00e5ff','stroke-width':3,'stroke-linecap':'round'},s);
    el('circle',{cx:X(p.d),cy:Y(p.v),r:6,fill:'#00e5ff',stroke:'#161c26','stroke-width':2},s);
  });
  // labels: every spike when 4 or fewer, otherwise the highest and the latest
  const iMax=pts.reduce((m,p,i)=>p.v>pts[m].v?i:m,0), last=pts.length-1;
  // labels closer than 56px to a neighbour's are pushed sideways (left one ends at the spike, right one starts there)
  const shown=pts.map((p,i)=>(pts.length<=4||i===iMax||i===last)?i:-1).filter(i=>i>=0);
  shown.forEach((i,k)=>{
    const p=pts[i], prev=k>0?pts[shown[k-1]]:null, next=k<shown.length-1?pts[shown[k+1]]:null;
    let anchor='middle', dx=0;
    if(next && X(next.d)-X(p.d)<56){anchor='end';dx=-4;}
    else if(prev && X(p.d)-X(prev.d)<56){anchor='start';dx=4;}
    el('text',{x:X(p.d)+dx,y:Y(p.v)-12,'text-anchor':anchor,'font-size':16,'font-weight':700,fill:'#eef3f8','font-family':'JetBrains Mono'},s,fmt(p.v));
  });
  return s;
}
const rows=document.getElementById('rows');
D.rows.forEach((r,i)=>{
  const div=document.createElement('div');div.className='ch';
  div.innerHTML=`<div style="min-width:0"><div class="nm"><span class="rk">${i+1}</span>${r.flag||''} ${esc(r.name)}</div>`+
    `<div class="meta mono">${esc(r.meta)}</div>`+
    `<div class="rep mono"><span class="n">${r.points.length}</span><span class="l">videos, all ≥2× VPI</span></div></div>`;
  div.appendChild(chart(r));rows.appendChild(div);
});
// shared date axis under the five charts; the calendar says what the x axis is
document.getElementById('axicon').innerHTML=icon('calendar',20,'#8496a8');
const ax=document.getElementById('ax');ax.setAttribute('width',W);
const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const lab=d=>{const t=new Date(day(d)*864e5);return t.getUTCDate()+' '+mon[t.getUTCMonth()];};
const n=Math.round(x1-x0), step=n>21?7:(n>10?3:2);
for(let k=0;k<=n;k+=step){const d=new Date((x0+k)*864e5).toISOString().slice(0,10);
  el('text',{x:X(d),y:16,'text-anchor':'middle','font-size':14,fill:'#8496a8','font-family':'JetBrains Mono'},ax,lab(d));}
</script>
</body></html>
