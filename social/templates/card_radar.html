<!doctype html><html><head><meta charset="utf-8"><title>IOSA fingerprints</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;800;900&display=swap">
<style>
  :root{--ground:#0d1117;--surface:#161c26;--line:#26303d;--ink:#eef3f8;--muted:#8496a8;--accent:#00e5ff;--amber:#ffb020;}
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;}
  .card{display:flex;flex-direction:column;background:radial-gradient(900px 600px at 15% 8%, rgba(255,176,32,.10), transparent 60%), radial-gradient(800px 600px at 90% 98%, rgba(0,229,255,.08), transparent 60%), var(--ground);width:1080px;height:1350px;box-sizing:border-box;padding:56px 72px 46px;}
  .mono{font-family:"JetBrains Mono",monospace;}
  .eyebrow{font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:24px;white-space:nowrap;}
  .eyebrow b{color:var(--amber);font-weight:700;}
  h1{margin:22px 0 0;font-size:64px;line-height:1.02;font-weight:900;letter-spacing:-.03em;}
  h1 em{font-style:normal;color:var(--accent);}
  .lede{margin-top:12px;font-size:18px;color:var(--muted);line-height:1.45;}
  .axes{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px;margin-top:16px;font-size:15px;color:var(--muted);line-height:1.4;}
  .axes b{color:var(--ink);}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;}
  .cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px 6px;}
  .nm{font-size:20px;font-weight:900;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nm .rk{color:var(--amber);font-family:"JetBrains Mono",monospace;font-size:17px;margin-right:4px;}
  svg{display:block;margin:0 auto;overflow:visible;}
  .note{background:transparent;border:1px dashed var(--line);border-radius:12px;padding:16px;font-size:16px;color:var(--muted);line-height:1.45;display:flex;align-items:center;}
  .note b{color:var(--ink);}
  .grow{flex:1;}
  .src{font-size:13.5px;color:var(--muted);line-height:1.5;margin:0;}
  footer{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:16px;margin-top:16px;}
  .mark{display:block;font-weight:700;font-size:20px;}
  .sub{display:block;font-size:14px;letter-spacing:.14em;color:var(--muted);margin-top:4px;}
  footer > div:last-child{color:var(--muted);font-size:20px;}
</style></head><body>
<section class="card" id="card">
  <div class="eyebrow mono"><span><b>IOSA</b> · <span id="kicker"></span></span><span id="where"></span></div>
  <h1 id="title"></h1>
  <div class="lede mono" id="lede"></div>
  <div class="axes mono" id="axes"></div>
  <div class="grid" id="grid"></div>
  <div class="grow"></div>
  <p class="src mono" id="src"></p>
  <footer class="mono"><div><span class="mark">IOSA</span><span class="sub">INSTITUTE FOR OPEN SOCIAL ANALYTICS</span></div><div>iosaresearch.org</div></footer>
</section>
<script>
/* One radar per channel, every axis a share from 0 to 100% (no rescaling, no combined score).
   Data: {kicker, where, title, lede, axes:[{k, label, def}], rows:[{rank, name, flag, vals:{k:0..100}}], note (HTML), src} */
const D=JSON.parse(new URLSearchParams(location.search).get('d'));
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
$('kicker').textContent=D.kicker; $('where').textContent=D.where; $('title').innerHTML=D.title; $('lede').innerHTML=D.lede; $('src').innerHTML=D.src;
$('axes').innerHTML=D.axes.map(a=>`<div><b>${a.label}</b> · ${a.def}</div>`).join('');
const R=96, C=150, n=D.axes.length;
const pt=(i,r)=>{const a=-3*Math.PI/4+i*2*Math.PI/n; return [C+r*Math.cos(a), C+r*Math.sin(a)];};
function el(p,tag,at,txt){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e;}
D.rows.forEach(r=>{
  const cell=document.createElement('div'); cell.className='cell';
  cell.innerHTML=`<div class="nm"><span class="rk">#${r.rank}</span>${r.flag||''} ${r.name}</div>`;
  const s=document.createElementNS(NS,'svg'); s.setAttribute('width',290); s.setAttribute('height',270); s.setAttribute('viewBox','5 18 290 270');
  [25,50,75,100].forEach(q=>el(s,'polygon',{points:D.axes.map((_,i)=>pt(i,R*q/100).join(',')).join(' '),fill:'none',stroke:q===100?'#3a4757':'#222c38','stroke-width':q===100?1.5:1}));
  // spokes; each axis end carries its name and the channel's value, so no label sits on the shape
  // axes on the diagonals; each corner carries the axis name and the channel's value, away from the shape
  const anchor=['end','start','start','end'], ox=[-6,6,6,-6], oy=[-18,-18,22,22];
  D.axes.forEach((a,i)=>{const [x,y]=pt(i,R); el(s,'line',{x1:C,y1:C,x2:x,y2:y,stroke:'#222c38'});
    el(s,'text',{x:x+ox[i],y:y+oy[i],'text-anchor':anchor[i],'font-size':13,fill:'#8496a8','font-family':'JetBrains Mono'},a.label);
    el(s,'text',{x:x+ox[i],y:y+oy[i]+17,'text-anchor':anchor[i],'font-size':16,'font-weight':700,fill:'#eef3f8','font-family':'JetBrains Mono'},r.vals[a.k]+'%');});
  const poly=D.axes.map((a,i)=>pt(i,R*Math.max(r.vals[a.k],2)/100).join(',')).join(' ');
  el(s,'polygon',{points:poly,fill:'rgba(0,229,255,.22)',stroke:'#00e5ff','stroke-width':2.5,'stroke-linejoin':'round'});
  D.axes.forEach((a,i)=>{const [x,y]=pt(i,R*Math.max(r.vals[a.k],2)/100); el(s,'circle',{cx:x,cy:y,r:4,fill:'#00e5ff'});});
  cell.appendChild(s); $('grid').appendChild(cell);
});
if(D.note){const n=document.createElement('div'); n.className='note mono'; n.innerHTML=D.note; $('grid').appendChild(n);}
</script></body></html>
