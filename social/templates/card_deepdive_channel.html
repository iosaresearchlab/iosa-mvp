<!doctype html><html><head><meta charset="utf-8"><title>IOSA deep dive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;800;900&display=swap">
<style>
  :root{--ground:#0d1117;--surface:#161c26;--line:#26303d;--ink:#eef3f8;--muted:#8496a8;--accent:#00e5ff;--amber:#ffb020;--dim:#3a4757;}
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;}
  .card{display:flex;flex-direction:column;background:radial-gradient(900px 600px at 15% 8%, rgba(255,176,32,.10), transparent 60%), radial-gradient(800px 600px at 90% 98%, rgba(0,229,255,.08), transparent 60%), var(--ground);width:1080px;height:1350px;box-sizing:border-box;padding:56px 72px 46px;}
  .mono{font-family:"JetBrains Mono",monospace;}
  .eyebrow{font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:24px;white-space:nowrap;}
  .eyebrow b{color:var(--amber);font-weight:700;}
  .head{display:grid;grid-template-columns:1fr 132px;column-gap:28px;margin-top:22px;align-items:start;}
  h1{margin:0;font-size:68px;line-height:1.0;font-weight:900;letter-spacing:-.03em;}
  h1 em{font-style:normal;color:var(--accent);}
  .who{margin-top:14px;font-size:30px;font-weight:800;}
  .who .rk{color:var(--amber);font-family:"JetBrains Mono",monospace;font-size:24px;margin-right:6px;}
  .lede{margin-top:10px;font-size:18px;color:var(--muted);line-height:1.45;}
  .lede b{color:var(--ink);font-weight:600;}
  .prev{position:relative;}
  .prev img{width:132px;height:165px;object-fit:cover;object-position:top;border-radius:8px;border:2px solid var(--amber);display:block;box-shadow:0 0 30px rgba(255,176,32,.25);}
  .prev span{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font-size:12px;letter-spacing:.12em;color:var(--amber);text-transform:uppercase;}
  .legend{display:flex;gap:22px;margin-top:22px;font-size:15px;color:var(--muted);align-items:center;}
  .legend span{display:flex;align-items:center;gap:8px;}
  svg{display:block;overflow:visible;}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;}
  .fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;}
  .fact .n{font-size:40px;font-weight:900;letter-spacing:-.02em;line-height:1;}
  .fact .l{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.35;}
  .grow{flex:1;}
  .src{font-size:13.5px;color:var(--muted);line-height:1.5;margin:0;}
  footer{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:16px;margin-top:16px;}
  .mark{display:block;font-weight:700;font-size:20px;}
  .sub{display:block;font-size:14px;letter-spacing:.14em;color:var(--muted);margin-top:4px;}
  footer > div:last-child{color:var(--muted);font-size:20px;}
</style></head><body>
<section class="card" id="card">
  <div class="eyebrow mono"><span><b>IOSA</b> · <b id="of"></b> · Deep dive</span><span id="where"></span></div>
  <div class="head"><div><h1 id="title"></h1><div class="who" id="who"></div><div class="lede mono" id="lede"></div></div>
    <div class="prev" id="prevbox"><img id="prev" alt=""><span class="mono">Previously</span></div></div>
  <div class="legend mono" id="legend"></div>
  <svg id="chart" width="936" height="560"></svg>
  <div class="facts" id="facts"></div>
  <div class="grow"></div>
  <p class="src mono" id="src"></p>
  <footer class="mono"><div><span class="mark">IOSA</span><span class="sub">INSTITUTE FOR OPEN SOCIAL ANALYTICS</span></div><div>iosaresearch.org</div></footer>
</section>
<script>
/* One channel, every upload. Bars = average views per day since publication (views today ÷ days since published),
   one per upload at its publication day: cyan if the video was ever observed in Most Popular (label = day-1 multiple),
   grey if never. The lane on top shows, reading by reading, which upload held the channel's place in the chart.
   Data: {of, where, title, rank, name, flag, lede, prev, slice:"Colombia · Gaming", from, to,
          uploads:[{n, d:"YYYY-MM-DD", vpd, mp:true|false, v (day-1 multiple), note}],
          lane:[{d:"YYYY-MM-DD", n}],   // one entry per daily reading with a video of the channel in the chart
          facts:[{n:"7 of 8", l:"..."}], src} */
const ICONS={"calendar": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2.5\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/>", "stopwatch": "<circle cx=\"12\" cy=\"14\" r=\"7.5\"/><path d=\"M12 14V10M9.5 2.5h5M12 2.5v4M18.2 7.3l1.6-1.6\"/>"};
const D=JSON.parse(new URLSearchParams(location.search).get('d'));
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
$('of').textContent=D.of; $('where').textContent=D.where; $('title').innerHTML=D.title;
$('who').innerHTML=`<span class="rk">#${D.rank}</span>${D.flag||''} ${D.name}`; $('lede').innerHTML=D.lede; $('src').innerHTML=D.src;
if(D.prev)$('prev').src=D.prev; else $('prevbox').style.visibility='hidden';
$('legend').innerHTML=`<span><svg width="14" height="14"><rect width="14" height="14" rx="2" fill="#00e5ff"/></svg> observed in Most Popular · day-1 multiple</span><span><svg width="14" height="14"><rect width="14" height="14" rx="2" fill="#3a4757"/></svg> never observed in it</span>`;
$('facts').innerHTML=D.facts.map(f=>`<div class="fact"><div class="n">${f.n}</div><div class="l mono">${f.l}</div></div>`).join('');
const day=s=>Date.parse(s+'T00:00:00Z')/864e5, x0=day(D.from), x1=day(D.to);
const s=$('chart'), W=936, PL=86, PR=10, LANE_Y=40, LANE_H=34, TOP=130, BOT=470;
const nDays=x1-x0+1, cw=(W-PL-PR)/nDays;
const X=d=>PL+(day(d)-x0)*cw;
function el(tag,at,txt){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;s.appendChild(e);return e;}
const fmtK=v=>v>=1e6?(v/1e6).toFixed(1)+'M':Math.round(v/1e3)+'K';
// lane: which upload held the channel's place in the chart, reading by reading
el('text',{x:PL,y:LANE_Y-12,'font-size':14,'letter-spacing':'1.5',fill:'#8496a8','font-family':'JetBrains Mono'},'IN MOST POPULAR · '+D.slice.toUpperCase()+' · ONE READING A DAY');
for(let i=0;i<nDays;i++){el('rect',{x:PL+i*cw+2,y:LANE_Y,width:cw-4,height:LANE_H,rx:4,fill:'#161c26',stroke:'#26303d'});}
D.lane.forEach(l=>{const x=X(l.d); el('rect',{x:x+2,y:LANE_Y,width:cw-4,height:LANE_H,rx:4,fill:'#00e5ff'});
  el('text',{x:x+cw/2,y:LANE_Y+LANE_H/2+6,'text-anchor':'middle','font-size':15,'font-weight':700,fill:'#0d1117','font-family':'JetBrains Mono'},'v'+l.n);});
if(D.pending){const x=X(D.pending); el('text',{x:x+cw/2,y:LANE_Y+LANE_H/2+5,'text-anchor':'middle','font-size':12,fill:'#5b6b7d','font-family':'JetBrains Mono'},'next');}
el('text',{x:PL-10,y:LANE_Y+LANE_H/2+5,'text-anchor':'end','font-size':13,fill:'#8496a8','font-family':'JetBrains Mono'},'chart');
// bars
const vmax=Math.max(...D.uploads.map(u=>u.vpd))*1.12;
const Y=v=>BOT-(v/vmax)*(BOT-TOP);
[50000,100000,150000,200000].filter(t=>t<vmax).forEach(t=>{el('line',{x1:PL,x2:W-PR,y1:Y(t),y2:Y(t),stroke:'#222c38','stroke-dasharray':'4 6'});
  el('text',{x:PL-10,y:Y(t)+5,'text-anchor':'end','font-size':13,fill:'#5b6b7d','font-family':'JetBrains Mono'},fmtK(t));});
el('text',{x:PL-10,y:TOP-14,'text-anchor':'end','font-size':13,fill:'#8496a8','font-family':'JetBrains Mono'},'views/day');
el('line',{x1:PL,x2:W-PR,y1:BOT,y2:BOT,stroke:'#26303d','stroke-width':2});
D.uploads.forEach(u=>{
  const x=X(u.d)+cw*0.18, w=cw*0.64, col=u.mp?'#00e5ff':'#3a4757';
  el('rect',{x,y:Y(u.vpd),width:w,height:BOT-Y(u.vpd),rx:5,fill:col});
  el('text',{x:x+w/2,y:Y(u.vpd)-10,'text-anchor':'middle','font-size':14,'font-weight':700,fill:u.mp?'#00e5ff':'#eef3f8','font-family':'JetBrains Mono'},fmtK(u.vpd));
  el('text',{x:x+w/2,y:BOT+20,'text-anchor':'middle','font-size':14,'font-weight':700,fill:u.mp?'#00e5ff':'#8496a8','font-family':'JetBrains Mono'},'v'+u.n);
  if(u.mp) el('text',{x:x+w/2,y:BOT+38,'text-anchor':'middle','font-size':13,fill:'#00e5ff','font-family':'JetBrains Mono'},u.v.toFixed(1)+'×');
  if(u.note){el('text',{x:x+w/2,y:Y(u.vpd)-30,'text-anchor':'middle','font-size':13,fill:'#ffb020','font-family':'JetBrains Mono'},u.note);}
});
// x axis: calendar icon and dates
const g=document.createElementNS(NS,'g'); g.setAttribute('transform',`translate(${PL-38},${BOT+52})`);
g.innerHTML=`<g fill="none" stroke="#8496a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.9)">${ICONS.calendar}</g>`; s.appendChild(g);
const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
for(let i=0;i<nDays;i+=2){const t=new Date((x0+i)*864e5); el('text',{x:PL+i*cw+cw/2,y:BOT+70,'text-anchor':'middle','font-size':14,fill:'#8496a8','font-family':'JetBrains Mono'},t.getUTCDate()+' '+mon[t.getUTCMonth()]);}
</script></body></html>
