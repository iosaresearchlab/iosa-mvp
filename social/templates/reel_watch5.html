<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@500;700;800;900&display=swap">
<style>
html,body{margin:0;background:#0d1117}
/* 1080x1920, 22 s. Instagram safe area ~ y 250..1500. */
#s{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Inter,sans-serif;color:#eef3f8;
 background:radial-gradient(1000px 1000px at 50% 42%, rgba(255,176,32,var(--glow,0.05)), transparent 65%),#0d1117}
.mono{font-family:'JetBrains Mono',monospace}
.top{position:absolute;left:80px;right:80px;top:150px;display:flex;justify-content:space-between;gap:24px;white-space:nowrap;font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:#8496a8}
.top b{color:#ffb020}
.layer{position:absolute;left:80px;right:80px;top:270px;height:1210px;opacity:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.rk{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:60px;letter-spacing:.1em;color:#ffb020}
.nm{font-weight:900;font-size:104px;letter-spacing:-.02em;line-height:1.05;margin-top:20px;max-width:920px}
.meta{font-family:'JetBrains Mono',monospace;font-size:34px;color:#8496a8;margin-top:18px}
.rep{display:flex;align-items:baseline;gap:22px;margin-top:46px}
.rep .n{font-weight:900;font-size:190px;color:#00e5ff;line-height:.9;text-shadow:0 0 60px rgba(0,229,255,.4)}
.rep .l{font-family:'JetBrains Mono',monospace;font-size:38px;color:#8496a8;text-align:left;line-height:1.35}
.rep .l b{color:#eef3f8}
svg{display:block;overflow:visible;margin-top:40px}
</style></head><body><div id="s">
 <div class="top mono"><span><b>IOSA</b> · 5 channels to watch</span><span id="ep"></span></div>
 <div class="layer" id="intro">
  <div class="mono" style="font-size:40px;letter-spacing:.16em;color:#ffb020;font-weight:700">THIS WEEK</div>
  <div style="font-weight:900;font-size:124px;line-height:1.02;letter-spacing:-.03em;margin-top:40px">5 channels that keep beating <span style="color:#ffb020">their own usual</span></div>
  <div class="meta" style="margin-top:60px;font-size:36px">Every video of theirs we caught in<br>YouTube Most Popular: 2× or more</div>
 </div>
 <div id="items"></div>
 <div class="layer" id="outro">
  <div style="display:inline-flex;align-items:flex-end;gap:8px">
   <svg width="190" height="273" viewBox="0 0 230 330" style="overflow:visible;margin:0;filter:drop-shadow(0 0 34px rgba(0,229,255,.6))">
    <path d="M8 300 L70 300 L150 110 L196 190" fill="none" stroke="#00e5ff" stroke-width="52"/>
    <circle cx="164" cy="38" r="38" fill="#00e5ff"/></svg>
   <div style="font-weight:900;font-size:273px;line-height:.74;letter-spacing:-.03em">OSA</div></div>
  <div style="font-weight:900;font-size:96px;margin-top:90px">Every Monday.</div>
  <div class="meta" style="margin-top:24px;font-size:38px">All of YouTube's Most Popular charts<br>in 34 countries, read every day.</div>
  <div class="mono" style="font-size:54px;color:#00e5ff;margin-top:70px">iosaresearch.org</div>
 </div>
</div>
<script>
/* Data: same JSON as card_watch5_v2 (ep added): {ep, from, to, rows:[{name, flag, meta, usual, points:[{d, v}]}]}, rank 1 first.
   Timeline (22 s): intro 0–2 | #5..#2 3 s each (2–14) | #1 14–18.5 | outro 18.5–22. Spikes rise one by one. */
const ICONS={"calendar": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2.5\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/>", "stopwatch": "<circle cx=\"12\" cy=\"14\" r=\"7.5\"/><path d=\"M12 14V10M9.5 2.5h5M12 2.5v4M18.2 7.3l1.6-1.6\"/>"};
const icon=(n,s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block">${ICONS[n]}</svg>`;
const D=JSON.parse(new URLSearchParams(location.search).get('d'));
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>1-Math.pow(1-clamp(x),3);
const win=(t,a,b,fi=.2,fo=.15)=>clamp(Math.min((t-a)/fi,(b-t)/fo));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const day=s=>Date.parse(s+'T00:00:00Z')/864e5, x0=day(D.from), x1=day(D.to);
$('ep').textContent=D.ep;
const W=900,H=330,PL=70,PR=20,PT=40,PB=10;
const X=d=>PL+(day(d)-x0)/(x1-x0||1)*(W-PL-PR);
let yTop=10; const Y=v=>PT+(1-Math.log(v)/Math.log(yTop))*(H-PT-PB);
/* each channel is shown alone, so each chart gets its own log scale; the usual, 2× and 10× lines are labelled */
const topFor=r=>{const m=Math.max(...r.points.map(p=>p.v));return [4,5,10,20,30,50,100,200,500,1000].find(t=>t>=m*1.25)||m*1.3;};
function el(tag,at,par,txt){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;par.appendChild(e);return e;}
const slots=[]; let t0=2; for(let r=5;r>=1;r--){const d=r>1?3:4.5; slots.push({r,a:t0,b:t0+d}); t0+=d;}
const spikes={};
slots.forEach(s=>{
  const r=D.rows[s.r-1]; yTop=topFor(r); s.yTop=yTop;
  const L=document.createElement('div'); L.className='layer'; L.id='i'+s.r;
  L.innerHTML=`<div class="rk">#${s.r}</div><div class="nm">${r.flag||''} ${esc(r.name)}</div><div class="meta">${esc(r.meta)}</div>`+
   `<div class="rep"><span class="n">${r.points.length}</span><span class="l">videos, all ≥2×<br>usual <b>${esc(r.usual)}</b></span></div>`;
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('width',W); svg.setAttribute('height',H);
  [[1,'usual','#5b6b7d',''],[2,'2×','#5b6b7d','8 8'],[10,'10×','#2c3846','3 10']].forEach(([v,l,c,da])=>{
    if(v>=yTop)return; el('line',{x1:PL,x2:W-PR,y1:Y(v),y2:Y(v),stroke:c,'stroke-width':v===1?3:2,'stroke-dasharray':da},svg);
    el('text',{x:PL-12,y:Y(v)+8,'text-anchor':'end','font-size':24,fill:'#8496a8','font-family':'JetBrains Mono'},svg,l);});
  const pts=[...r.points].sort((a,b)=>day(a.d)-day(b.d));
  spikes[s.r]=pts.map(p=>({p,line:el('line',{x1:X(p.d),x2:X(p.d),y1:Y(1),y2:Y(1),stroke:'#00e5ff','stroke-width':6,'stroke-linecap':'round'},svg),
    dot:el('circle',{cx:X(p.d),cy:Y(1),r:11,fill:'#00e5ff',stroke:'#0d1117','stroke-width':3,opacity:0},svg),
    lab:el('text',{x:X(p.d),y:Y(p.v)-22,'text-anchor':'middle','font-size':28,'font-weight':700,fill:'#eef3f8','font-family':'JetBrains Mono',opacity:0},svg,p.v.toFixed(1)+'×')}));
  const iMax=pts.reduce((m,p,i)=>p.v>pts[m].v?i:m,0); spikes[s.r].forEach((o,i)=>o.show=pts.length<=4||i===iMax||i===pts.length-1);
  // x axis: calendar icon, then the first and last day of the window
  const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const lab=d=>{const t=new Date(day(d)*864e5);return t.getUTCDate()+' '+mon[t.getUTCMonth()];};
  const ax=document.createElementNS(NS,'g'); ax.setAttribute('transform',`translate(${PL-44},${H+12})`);
  ax.innerHTML=`<g fill="none" stroke="#8496a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="scale(1.25)">${ICONS.calendar}</g>`; svg.appendChild(ax);
  el('text',{x:PL,y:H+38,'text-anchor':'start','font-size':26,fill:'#8496a8','font-family':'JetBrains Mono'},svg,lab(D.from));
  el('text',{x:W-PR,y:H+38,'text-anchor':'end','font-size':26,fill:'#8496a8','font-family':'JetBrains Mono'},svg,lab(D.to));
  L.appendChild(svg); $('items').appendChild(L);
});
function render(t){
  $('intro').style.opacity=win(t,0.1,2.0,.3,.15);
  slots.forEach(s=>{
    $('i'+s.r).style.opacity=win(t,s.a,s.b); yTop=s.yTop;
    const sp=spikes[s.r], span=Math.min(1.6,(s.b-s.a)-1.0);
    sp.forEach((o,i)=>{
      const k=ease((t-s.a-0.4-i*span/sp.length)/0.35);
      const v=Math.exp(Math.log(o.p.v)*k);
      o.line.setAttribute('y2',Y(v)); o.dot.setAttribute('cy',Y(v)); o.dot.setAttribute('opacity',k>0?1:0);
      o.lab.setAttribute('opacity',o.show&&k>=1?1:0);
    });
  });
  $('outro').style.opacity=clamp((t-18.5)/.35);
  $('s').style.setProperty('--glow',(0.05+0.12*win(t,14,18.5,.2,.4)).toFixed(3));
}
window.render=render; render(0);
</script></body></html>
